<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OneCall Tech Solutions</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Header and Logo Fix */
    header {
      height: auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
    }

    .logo {
      height: 60px; /* Set fixed size for logo */
      width: 60px;
      border-radius: 50%;
      object-fit: cover;
      animation: bounce 1s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-10px);
      }
    }

    .nav-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      align-items: center;
      height: 100%;
    }

    .nav-links a {
      text-decoration: none;
      color: #1D4ED8;
      font-weight: 600;
      transition: color 0.3s;
      font-size: 1rem;
      padding: 4px 8px;
    }

    .nav-links a:hover {
      color: #2563EB;
    }

    /* Scroll Behavior for Contact Button */
    .smooth-scroll {
      scroll-behavior: smooth;
    }

    /* Service and Pricing Section */
    .service-description {
      font-size: 1.25rem;
    }

    .service-card:hover {
      transform: scale(1.03);
      transition: transform 0.3s ease;
      box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
    }

    @media (max-width: 768px) {
      .nav-links {
        flex-direction: column;
        gap: 8px;
      }

      .service-description {
        font-size: 1.125rem;
      }

      .text-4xl {
        font-size: 2rem;
      }

      .text-lg {
        font-size: 1rem;
      }

      .logo {
        height: 50px;
        width: 50px; /* Adjusted logo size for smaller screens */
      }
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 smooth-scroll">
  <header class="bg-white shadow-md flex flex-col md:flex-row items-center justify-between px-6 py-4">
    <img src="images/logo.png" alt="OneCall Tech Solutions Logo" class="logo" loading="lazy">
    <div class="nav-links mt-2 md:mt-0">
      <a href="#services">Services</a>
      <a href="#pricing">Pricing</a>
      <a href="#about">About</a>
      <a href="#contact" class="scroll-link">Contact</a> <!-- Fix for Contact link -->
      <a href="#booking" id="bookNowBtn">Book Now</a>
    </div>
  </header>

  <!-- Other sections remain unchanged... -->

  <!-- Contact Section -->
  <section id="contact" class="bg-gray-50 py-16">
    <div class="container mx-auto px-4 text-center">
      <h2 class="text-3xl font-semibold mb-4">Contact Us</h2>
      <p class="text-lg max-w-2xl mx-auto mb-8">Have questions or need help? Reach out to us today, and we'll get back to you as soon as possible!</p>
      <form action="https://formspree.io/f/xzzrezvy" method="POST">
        <div class="mb-4">
          <label for="name" class="block text-lg font-semibold">Your Name</label>
          <input type="text" name="name" id="name" class="w-full px-4 py-2 mt-2 border border-gray-300 rounded" required />
        </div>
        <div class="mb-4">
          <label for="email" class="block text-lg font-semibold">Your Email</label>
          <input type="email" name="email" id="email" class="w-full px-4 py-2 mt-2 border border-gray-300 rounded" required />
        </div>
        <div class="mb-4">
          <label for="phone" class="block text-lg font-semibold">Phone Number</label>
          <input type="text" name="phone" id="phone" class="w-full px-4 py-2 mt-2 border border-gray-300 rounded" required />
        </div>
        <div class="mb-4">
          <label for="message" class="block text-lg font-semibold">Message</label>
          <textarea name="message" id="message" class="w-full px-4 py-2 mt-2 border border-gray-300 rounded" rows="4" required></textarea>
        </div>
        <button type="submit" class="bg-blue-600 text-white py-2 px-6 rounded">Submit</button>
      </form>
    </div>
  </section>

  <!-- Booking Modal -->
  <div id="bookingModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2 class="text-2xl font-semibold mb-4">Book Your Service</h2>
      <form action="https://formspree.io/f/xzzrezvy" method="POST">
        <div class="mb-4">
          <label for="service" class="block text-lg font-semibold">Select Service</label>
          <select name="service" id="service" class="w-full px-4 py-2 mt-2 border border-gray-300 rounded">
            <option value="TV Mounting">TV Mounting</option>
            <option value="Structured Network Wiring">Structured Network Wiring</option>
            <option value="Camera Systems">Camera Systems</option>
            <option value="Home Automation">Home Automation</option>
          </select>
        </div>
        <div class="mb-4">
          <label for="timeSlot" class="block text-lg font-semibold">Select Time Slot</label>
          <select name="timeSlot" id="timeSlot" class="w-full px-4 py-2 mt-2 border border-gray-300 rounded">
            <option value="9:00 AM">9:00 AM</option>
            <option value="11:00 AM">11:00 AM</option>
            <option value="2:00 PM">2:00 PM</option>
            <option value="4:00 PM">4:00 PM</option>
          </select>
        </div>
        <div class="mb-4">
          <label for="name" class="block text-lg font-semibold">Your Name</label>
          <input type="text" name="name" id="name" class="w-full px-4 py-2 mt-2 border border-gray-300 rounded" required />
        </div>
        <div class="mb-4">
          <label for="email" class="block text-lg font-semibold">Your Email</label>
          <input type="email" name="email" id="email" class="w-full px-4 py-2 mt-2 border border-gray-300 rounded" required />
        </div>
        <div class="mb-4">
          <label for="phone" class="block text-lg font-semibold">Phone Number</label>
          <input type="text" name="phone" id="phone" class="w-full px-4 py-2 mt-2 border border-gray-300 rounded" required />
        </div>
        <button type="submit" class="bg-blue-600 text-white py-2 px-6 rounded">Book Now</button>
      </form>
    </div>
  </div>

  <script>
    // Modal logic
    var modal = document.getElementById("bookingModal");
    var btn = document.getElementById("bookNowBtn");
    var span = document.getElementsByClassName("close")[0];

    btn.onclick = function() {
      modal.style.display = "block";
    }

    span.onclick = function() {
      modal.style.display = "none";
    }

    window.onclick = function(event) {
      if (event.target == modal) {
        modal.style.display = "none";
      }
    }

    // Smooth Scroll for Contact
    document.querySelector('.scroll-link').addEventListener('click', function(e) {
      e.preventDefault();
      document.querySelector('#contact').scrollIntoView({ behavior: 'smooth' });
    });
  </script>
</body>
</html>
